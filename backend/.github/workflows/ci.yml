name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: |
          cd backend
          npm ci
      - name: Typecheck
        run: |
          cd backend
          npm run build
      - name: Prisma Generate
        run: |
          cd backend
          npx prisma generate
